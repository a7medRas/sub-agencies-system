<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>نظام الوكالات</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    body { font-family: 'Cairo', sans-serif; margin: 0; padding: 0; background: #f4f6fa; transition: background .3s, color .3s; }
    body.dark { background: #222; color: #eee; }
    header { background: #6c63ff; color: white; padding: 15px; display: flex; justify-content: space-between; align-items: center; }
    header h2 { margin: 0; }
    .container { padding: 20px; }
    .hidden { display: none; }
    input, button, select { padding: 8px; margin: 5px; border-radius: 8px; border: 1px solid #ccc; font-family: 'Cairo', sans-serif; }
    button { background: #6c63ff; color: white; border: none; cursor: pointer; }
    button:hover { background: #5b3cc4; }
    .agency-card { background: white; border-radius: 20px; padding: 20px; margin: 15px 0; box-shadow: 0 4px 10px rgba(0, 0, 0, .1); display: flex; justify-content: space-between; align-items: flex-start; }
    body.dark .agency-card, body.dark .broadcaster-card { background: #333; color: #eee; }
    .agency-center { flex: 1; text-align: center; }
    .agency-name { font-size: 28px; font-weight: bold; background: linear-gradient(90deg, #b8860b, #fff, #daa520); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-size: 200% auto; animation: shine 3s linear infinite; }
    @keyframes shine { to { background-position: 200% center; } }
    .agency-code { margin-top: 8px; font-weight: bold; }
    .copy-btn { font-size: 12px; padding: 3px 6px; margin-left: 6px; background: #6c63ff; color: #fff; border: none; border-radius: 5px; cursor: pointer; }
    .agency-right { text-align: right; min-width: 180px; }
    .countdown { background: #6c63ff; color: white; padding: 12px 20px; border-radius: 20px; width: fit-content; margin: 15px auto; font-size: 16px; font-weight: bold; }
    .summary { display: flex; gap: 15px; margin: 15px 0; }
    .summary .item { flex: 1; background: #f9f9f9; padding: 15px; border-radius: 15px; text-align: center; }
    body.dark .summary .item { background: #444; }
    .broadcaster-card { background: white; border-radius: 15px; padding: 15px; margin: 10px 0; box-shadow: 0 3px 8px rgba(0, 0, 0, .1); }
    .progress-bar { background: #eee; border-radius: 15px; height: 10px; margin: 6px 0; }
    .progress { height: 100%; border-radius: 15px; background: #6c63ff; }
    .ranking-table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    .ranking-table th, .ranking-table td { border: 1px solid #ccc; padding: 8px; text-align: center; }
    .chart-container { width: 100%; max-width: 600px; margin: 20px auto; }
  </style>
</head>
<body>
<header>
  <h2 id="title">📊 نظام الوكالات</h2>
  <div>
    <span id="roleLabel" style="margin-right:15px;font-weight:bold;"></span>
    <button onclick="toggleLang()" id="langBtn">EN</button>
    <button onclick="toggleDarkMode()" id="modeBtn">🌙</button>
    <button id="dashboardBtn" class="hidden" onclick="showDashboard()">📊 Dashboard</button>
    <button onclick="logout()" id="logoutBtn" class="hidden">🚪 خروج</button>
  </div>
</header>

<!-- Login -->
<div class="container" id="loginPage">
  <h3 id="loginTitle">🔐 تسجيل الدخول</h3>
  <input id="loginUser" placeholder="👤 اسم المستخدم"><br>
  <input type="password" id="loginPass" placeholder="🔑 كلمة المرور"><br>
  <button onclick="login()" id="loginBtn">دخول</button>
  <p id="loginError" style="color:red"></p>
</div>

<!-- Home -->
<div class="container hidden" id="homePage">
  <h3 id="agenciesLabel">🏢 الوكالات</h3>
  <button id="addAgencyBtn" onclick="showAgencyForm()">➕ إضافة وكالة</button>
  <div id="agenciesList"></div>
</div>

<!-- Agency Page -->
<div class="container hidden" id="agencyPage">
  <button onclick="goHome()" id="backBtn">⬅ رجوع</button>
  <div id="agencyInfo"></div>
  <div class="summary">
    <div class="item" id="beansSummary"></div>
    <div class="item" id="broadcastersSummary"></div>
    <div class="item" id="invoiceSummary"></div>
  </div>
  <div style="text-align:center;margin:10px 0;">
    <button onclick="exportInvoiceExcel()">📊 تصدير Excel</button>
    <button onclick="exportInvoicePDF()">📄 تصدير PDF</button>
  </div>
  <h3 id="broadcastersLabel">🎙 المذيعين</h3>
  <button id="addBroadcasterBtn" onclick="showBroadcasterForm()">➕ إضافة مذيع</button>
  <div id="broadcasters"></div>
</div>

<!-- Dashboard -->
<div class="container hidden" id="dashboardPage">
  <button onclick="goHomeFromDashboard()">⬅ رجوع</button>
  <h3>📊 لوحة التحكم (Admin)</h3>
  <div class="chart-container"><canvas id="beansLine"></canvas></div>
  <div class="chart-container"><canvas id="countryPie"></canvas></div>
  <div class="chart-container"><canvas id="topBroadcastersBar"></canvas></div>
  <h3>🏆 أفضل 10</h3>
  <table class="ranking-table" id="rankingTable">
    <thead><tr><th>#</th><th>الاسم</th><th>Beans</th><th>Badge</th></tr></thead>
    <tbody></tbody>
  </table>
</div>

<!-- Forms -->
<div class="container hidden" id="agencyForm">
  <h3 id="agencyFormTitle">➕ وكالة جديدة</h3>
  <input id="agencyName" placeholder="اسم الوكالة"><br>
  <input id="agencyAgent" placeholder="اسم الوكيل"><br>
  <input id="agencyCountry" placeholder="الدولة"><br>
  <input id="agencyLikee" placeholder="Likee ID"><br>
  <input id="agencyManager" placeholder="مدير الوكالة"><br>
  <button onclick="saveAgency()">💾 حفظ</button>
  <button onclick="cancelForms()">❌ إلغاء</button>
</div>

<div class="container hidden" id="broadcasterForm">
  <h3 id="broadcasterFormTitle">➕ مذيع جديد</h3>
  <input id="broadcasterName" placeholder="اسم المذيع"><br>
  <input id="broadcasterId" placeholder="ID"><br>
  <input id="broadcasterCountry" placeholder="الدولة"><br>
  <input id="broadcasterBeans" type="number" placeholder="Beans"><br>
  <input id="broadcasterDays" type="number" placeholder="أيام"><br>
  <input id="broadcasterHours" type="number" placeholder="ساعات"><br>
  <button onclick="saveBroadcaster()">💾 حفظ</button>
  <button onclick="cancelForms()">❌ إلغاء</button>
</div>

<script>
// بيانات أولية
let users=[
  {username:"admin",password:"123",role:"Admin"},
  {username:"viewer",password:"000",role:"Viewer"}
];
let agencies=[{
  id:"AG-123456",name:"وكالة النور",agentName:"علي",country:"🇪🇬",likee:"889900",manager:"أحمد",
  agentUser:"agentAG123456",agentPass:"222",
  broadcasters:[
    {name:"محمود",id:"1001",country:"🇪🇬",beans:550000,days:20,hours:80},
    {name:"ليلى",id:"1002",country:"🇸🇦",beans:1200000,days:28,hours:150}
  ]
}];
users.push({username:"manager1",password:"111",role:"Manager",agencyIndex:0});
users.push({username:"agentAG123456",password:"222",role:"Agent",agencyIndex:0});

// جدول الرواتب
const salaryTable=[
 {level:"S18",beans:50000,salary:200},
 {level:"S6",beans:500000,salary:3200},
 {level:"S10",beans:1000000,salary:6400},
 {level:"F",beans:10000,salary:50}
];
function calculateSalary(beans){
  let level="F",salary=0;
  salaryTable.forEach(l=>{if(beans>=l.beans){level=l.level;salary=l.salary;}});
  return {level,salary};
}

let currentUser=null,currentAgency=0,editingAgency=null,editingBroadcaster=null;

// Login/Logout
function login(){
  let u=loginUser.value,p=loginPass.value;
  let user=users.find(x=>x.username===u&&x.password===p);
  if(!user){loginError.innerText="❌ خطأ";return;}
  currentUser=user;
  loginPage.classList.add("hidden");
  logoutBtn.classList.remove("hidden");

  // 👤 عرض الدور الحالي
  roleLabel.innerText = "👤 الدور: " + currentUser.role;

  if(user.role==="Admin"){
    homePage.classList.remove("hidden");
    dashboardBtn.classList.remove("hidden");
    renderAgencies(); // ✅ عرض الوكالات مباشرة
  }
  else if(user.role==="Viewer"){
    homePage.classList.remove("hidden");
    renderAgencies(); // ✅ عرض الوكالات مباشرة
  }
  else openAgency(user.agencyIndex,true);
}
function logout(){
  currentUser=null;
  roleLabel.innerText = "";
  loginPage.classList.remove("hidden");
  homePage.classList.add("hidden");
  agencyPage.classList.add("hidden");
  dashboardPage.classList.add("hidden");
  logoutBtn.classList.add("hidden");
  dashboardBtn.classList.add("hidden");
}

// Agencies
function renderAgencies(){
  agenciesList.innerHTML="";
  agencies.forEach((a,i)=>{
    let totalBeans=0,totalSalary=0;a.broadcasters.forEach(b=>{let {salary}=calculateSalary(b.beans);totalBeans+=b.beans;totalSalary+=salary;});
    let div=document.createElement("div");div.className="agency-card";
    div.innerHTML=`
      <div class="agency-center">
        <div class="agency-name">${a.name}</div>
        <div class="agency-code">${a.id} <button class="copy-btn" onclick="copyCode('${a.id}')">📋 نسخ</button></div>
        <div>${a.country}</div>
      </div>
      <div class="agency-right">
        <p>👤 الوكيل: ${a.agentName}</p>
        <p>📱 Likee ID: ${a.likee}</p>
        <p>👨‍💼 المدير: ${a.manager}</p>
      </div>
    `;
    div.innerHTML+=`<div class="countdown" id="countdown">--</div>`;
    div.innerHTML+=`<p>🎉${totalBeans} | 👥${a.broadcasters.length} | 💰${totalSalary}$</p>`;
    div.innerHTML+=`<button onclick="openAgency(${i})">📂 فتح</button>`;
    if(currentUser.role==="Admin" || currentUser.role==="Manager"){
      div.innerHTML+=`<button onclick="editAgency(${i})">✏️ تعديل</button><button onclick="deleteAgency(${i})">🗑️ حذف</button>`;
    }
    agenciesList.appendChild(div);
  });
  addAgencyBtn.style.display=(currentUser.role==="Admin"||currentUser.role==="Manager")?"inline-block":"none";
}
function copyCode(code){navigator.clipboard.writeText(code);alert("✅ تم نسخ كود الوكالة: "+code);}

// CRUD Agencies
function showAgencyForm(){if(currentUser.role==="Viewer")return;editingAgency=null;agencyForm.classList.remove("hidden");}
function editAgency(i){if(currentUser.role==="Viewer")return;editingAgency=i;let a=agencies[i];agencyName.value=a.name;agencyAgent.value=a.agentName;agencyCountry.value=a.country;agencyLikee.value=a.likee;agencyManager.value=a.manager;agencyForm.classList.remove("hidden");}
function saveAgency(){if(currentUser.role==="Viewer")return; if(editingAgency!==null){let a=agencies[editingAgency];a.name=agencyName.value;a.agentName=agencyAgent.value;a.country=agencyCountry.value;a.likee=agencyLikee.value;a.manager=agencyManager.value;} else {let id="AG-"+Math.floor(Math.random()*999999);let agentUser="agent"+id;let agentPass=Math.floor(1000+Math.random()*9000).toString();let a={id,name:agencyName.value,agentName:agencyAgent.value,country:agencyCountry.value,likee:agencyLikee.value,manager:agencyManager.value,agentUser,agentPass,broadcasters:[]};agencies.push(a);users.push({username:agentUser,password:agentPass,role:"Agent",agencyIndex:agencies.length-1});}cancelForms();renderAgencies();}
function deleteAgency(i){if(!(currentUser.role==="Admin"||currentUser.role==="Manager"))return;agencies.splice(i,1);renderAgencies();}

// Agency Page
function openAgency(i,readonly=false){currentAgency=i;homePage.classList.add("hidden");agencyPage.classList.remove("hidden");renderAgencyPage(readonly);}
function goHome(){agencyPage.classList.add("hidden");homePage.classList.remove("hidden");}
function renderAgencyPage(readonly=false){
  let a=agencies[currentAgency];let totalBeans=0,totalSalary=0;a.broadcasters.forEach(b=>{let {salary}=calculateSalary(b.beans);totalBeans+=b.beans;totalSalary+=salary;});
  agencyInfo.innerHTML=`
    <div class="agency-card">
      <div class="agency-center">
        <div class="agency-name">${a.name}</div>
        <div class="agency-code">${a.id} <button class="copy-btn" onclick="copyCode('${a.id}')">📋 نسخ</button></div>
        <div>${a.country}</div>
      </div>
      <div class="agency-right">
        <p>👤 الوكيل: ${a.agentName}</p>
        <p>📱 Likee ID: ${a.likee}</p>
        <p>👨‍💼 المدير: ${a.manager}</p>
      </div>
    </div>
    <div class="countdown" id="countdown">--</div>
  `;
  if(currentUser.role==="Admin" || currentUser.role==="Manager"){
    agencyInfo.innerHTML+=`
      <h4>🔐 بيانات دخول الوكيل</h4>
      <table border="1" style="width:100%;text-align:center;border-collapse:collapse;">
        <tr><th>Username</th><th>Password</th>${currentUser.role==="Admin"?"<th>تغيير</th>":""}</tr>
        <tr>
          <td>${a.agentUser}</td>
          <td>${a.agentPass}</td>
          ${currentUser.role==="Admin" ? `<td><button onclick="changeAgentPass(${currentAgency})">🔑 تغيير</button></td>` : ""}
        </tr>
      </table>
    `;
  }
  beansSummary.innerText="🎉 "+totalBeans;broadcastersSummary.innerText="👥 "+a.broadcasters.length;invoiceSummary.innerText="💰 "+totalSalary+"$";
  startCountdown();renderBroadcasters(readonly||currentUser.role==="Agent"||currentUser.role==="Viewer");
  addBroadcasterBtn.style.display=(currentUser.role==="Admin"||currentUser.role==="Manager")?"inline-block":"none";
}

// Broadcaster CRUD
function renderBroadcasters(readonly=false){
  broadcasters.innerHTML="";
  agencies[currentAgency].broadcasters.forEach((b,j)=>{
    let {level,salary}=calculateSalary(b.beans);
    let card=document.createElement("div");
    card.className="broadcaster-card";
    card.innerHTML=`<strong>${b.name}</strong> (${b.id}) - ${b.country}
    <div>💎 Beans: ${b.beans} (${level}) ${makeBar(b.beans,1500000)}</div>
    <div>📅 Days: ${b.days}${makeBar(b.days,30)}</div>
    <div>⏱ Hours: ${b.hours}${makeBar(b.hours,200)}</div>
    <p>💰 ${salary}$</p>
    ${(currentUser.role==="Admin"||currentUser.role==="Manager")&&!readonly?`<button onclick="editBroadcaster(${j})">✏️</button><button onclick="deleteBroadcaster(${j})">🗑️</button>`:""}`;
    broadcasters.appendChild(card);
  });
}

function showBroadcasterForm(){if(currentUser.role==="Viewer")return;editingBroadcaster=null;broadcasterForm.classList.remove("hidden");}
function editBroadcaster(j){if(currentUser.role==="Viewer")return;editingBroadcaster=j;let b=agencies[currentAgency].broadcasters[j];broadcasterName.value=b.name;broadcasterId.value=b.id;broadcasterCountry.value=b.country;broadcasterBeans.value=b.beans;broadcasterDays.value=b.days;broadcasterHours.value=b.hours;broadcasterForm.classList.remove("hidden");}
function saveBroadcaster(){if(currentUser.role==="Viewer")return;let b={name:broadcasterName.value,id:broadcasterId.value,country:broadcasterCountry.value,beans:parseInt(broadcasterBeans.value),days:parseInt(broadcasterDays.value),hours:parseInt(broadcasterHours.value)};if(editingBroadcaster!==null){agencies[currentAgency].broadcasters[editingBroadcaster]=b;}else agencies[currentAgency].broadcasters.push(b);cancelForms();renderBroadcasters();}
function deleteBroadcaster(j){if(!(currentUser.role==="Admin"||currentUser.role==="Manager"))return;agencies[currentAgency].broadcasters.splice(j,1);renderBroadcasters();}

function makeBar(v,m){let p=Math.min(100,(v/m*100));return `<div class="progress-bar"><div class="progress" style="width:${p}%"></div></div>`;}

function exportInvoiceExcel(){
  let a=agencies[currentAgency];
  let data=[["اسم المذيع","ID","Beans","أيام","ساعات","المستوى","الراتب"]];
  a.broadcasters.forEach(b=>{
    let {level,salary}=calculateSalary(b.beans);
    data.push([b.name,b.id,b.beans,b.days,b.hours,level,salary+"$"]);
  });
  let ws=XLSX.utils.aoa_to_sheet(data);
  let wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,"Invoice");
  XLSX.writeFile(wb,`${a.name}_Invoice.xlsx`);
}

function exportInvoicePDF(){
  let a=agencies[currentAgency];
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  doc.text(`فاتورة الوكالة: ${a.name}`, 10, 10);
  doc.text(`الكود: ${a.id}`, 10, 20);
  let rows = [];
  a.broadcasters.forEach(b => {
    let { level, salary } = calculateSalary(b.beans);
    rows.push([b.name, b.id, b.beans, b.days, b.hours, level, salary + "$"]);
  });
  let startY = 30;
  doc.text("الاسم | ID | Beans | أيام | ساعات | المستوى | الراتب", 10, startY);
  rows.forEach((r, i) => {
    doc.text(r.join(" | "), 10, startY + 10 * (i + 1));
  });
  doc.save(`${a.name}_Invoice.pdf`);
}

// Dark Mode
function toggleDarkMode() {
  let b = document.body;
  if (b.classList.contains("dark")) {
    b.classList.remove("dark");
    localStorage.setItem("mode", "light");
    modeBtn.innerText = "🌙";
  } else {
    b.classList.add("dark");
    localStorage.setItem("mode", "dark");
    modeBtn.innerText = "☀️";
  }
}

(function initMode() {
  let m = localStorage.getItem("mode") || "light";
  if (m === "dark") document.body.classList.add("dark");
  modeBtn.innerText = m === "dark" ? "☀️" : "🌙";
})();

// Lang
let lang = "ar";
const translations = {
  ar: { loginTitle: "🔐 تسجيل الدخول", loginBtn: "دخول", addAgencyBtn: "➕ إضافة وكالة", addBroadcasterBtn: "➕ إضافة مذيع", backBtn: "⬅ رجوع", agenciesLabel: "🏢 الوكالات", broadcastersLabel: "🎙 المذيعين" },
  en: { loginTitle: "🔐 Login", loginBtn: "Login", addAgencyBtn: "➕ Add Agency", addBroadcasterBtn: "➕ Add Broadcaster", backBtn: "⬅ Back", agenciesLabel: "🏢 Agencies", broadcastersLabel: "🎙 Broadcasters" }
};
function toggleLang() { lang = (lang === "ar" ? "en" : "ar"); localStorage.setItem("lang", lang); applyLang(); }
function applyLang() {
  let t = translations[lang];
  loginTitle.innerText = t.loginTitle;
  loginBtn.innerText = t.loginBtn;
  addAgencyBtn.innerText = t.addAgencyBtn;
  addBroadcasterBtn.innerText = t.addBroadcasterBtn;
  backBtn.innerText = t.backBtn;
  agenciesLabel.innerText = t.agenciesLabel;
  broadcastersLabel.innerText = t.broadcastersLabel;
  langBtn.innerText = (lang === "ar" ? "EN" : "AR");
}
(function initLang() { lang = localStorage.getItem("lang") || "ar"; applyLang(); })();
</script>
</body>
</html>
